  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

and build an intelligent full-stack application around it.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:32px;border-left:1px solid #dcdfe2;padding-left:clamp(24px,3.5vw,60px)\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">01 / RELEASE<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,1.8vw,30px)\">Friday, date to be announced<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">02 / TRACKS<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,1.8vw,30px)\">{{ trackSummary }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ pending }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;border-top:1px solid #23272b;border-bottom:1px solid #dcdfe2;padding:20px 0\">\n      <span style=\"width:10px;height:10px;border:2px solid #3aaee8;border-radius:50%\"><\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.08em;color:#23272b\">NOT YET RELEASED<\u002Fspan>\n      <span style=\"font-size:16px;color:#4b5157;line-height:1.5\">The structure below shows how statements will appear. Titles and descriptions are published on Friday.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:32px 0 8px\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;color:#4b5157;margin-right:12px\">FILTER<\u002Fspan>\n    <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n      <sc-if value=\"{{ c.active }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ c.pick }}\" style=\"cursor:pointer;background:#23272b;color:#ffffff;border:1px solid #23272b;padding:10px 18px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.06em\">{{ c.label }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ c.inactive }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ c.pick }}\" style=\"cursor:pointer;background:#ffffff;color:#23272b;border:1px solid #c9cdd1;padding:10px 18px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.06em\" style-hover=\"border-color:#23272b\">{{ c.label }}<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ visibleTracks }}\" as=\"t\" hint-placeholder-count=\"2\">\n    <div style=\"padding-top:clamp(48px,5vw,88px)\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px 40px;align-items:end;padding-bottom:24px;border-bottom:1px solid #23272b\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">TRACK {{ t.num }}<\u002Fspan>\n          <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(30px,3.4vw,58px);line-height:1.02;letter-spacing:-0.03em\">{{ t.name }}<\u002Fh2>\n        <\u002Fdiv>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.06em;color:#4b5157;justify-self:start\">{{ t.countLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ t.statements }}\" as=\"s\" hint-placeholder-count=\"2\">\n        <article style=\"display:flex;flex-wrap:wrap;gap:12px clamp(24px,5vw,96px);padding:36px 0;border-bottom:1px solid #dcdfe2\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:0.06em;color:#23272b;padding-top:6px;min-width:120px\">{{ s.id }}<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:16px;max-width:760px\">\n            <h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(22px,1.9vw,32px);line-height:1.2;letter-spacing:-0.015em\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin:0;font-size:clamp(16px,1.1vw,19px);line-height:1.65;color:#4b5157;text-wrap:pretty\">{{ s.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSchedule }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Schedule\">\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding-top:40px\">\n    <div style=\"display:flex;align-items:center;gap:24px\">\n      <span style=\"width:48px;height:4px;background:#3aaee8\"><\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">COGNIX ’26 / SCHEDULE<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">TWO DAYS<\u002Fspan>\n  <\u002Fdiv>\n  <h1 style=\"margin:clamp(48px,5.5vw,96px) 0 0;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(52px,8.6vw,150px);line-height:0.92;letter-spacing:-0.045em;text-transform:uppercase\">Schedule<\u002Fh1>\n  <div style=\"height:1px;background:#dcdfe2;margin-top:clamp(48px,5.5vw,96px)\"><\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px clamp(32px,6vw,120px);padding:clamp(40px,3.6vw,64px) 0\">\n    <p style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,2.9vw,50px);line-height:1.12;letter-spacing:-0.02em;max-width:18em;text-wrap:pretty\">Problem statements go out on Friday. The hackathon runs on Saturday.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:32px;border-left:1px solid #dcdfe2;padding-left:clamp(24px,3.5vw,60px)\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">01 / DATE<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,1.8vw,30px)\">To be announced<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">02 / VENUE<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,1.8vw,30px)\">Venue to be announced<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"2\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px clamp(32px,6vw,120px);border-top:1px solid #23272b;padding:clamp(36px,3.6vw,64px) 0 clamp(48px,5vw,88px)\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;align-self:start\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">DAY {{ d.num }} / {{ d.dateLabel }}<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(44px,5.6vw,96px);line-height:0.95;letter-spacing:-0.04em\">{{ d.name }}<\u002Fh2>\n        <span style=\"font-size:clamp(16px,1.1vw,19px);color:#4b5157;line-height:1.5\">{{ d.summary }}<\u002Fspan>\n      <\u002Fdiv>\n      <ol style=\"list-style:none;margin:0;padding:0;border-left:1px solid #dcdfe2\">\n        <sc-for list=\"{{ d.items }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <li style=\"position:relative;display:grid;grid-template-columns:minmax(88px,140px) minmax(0,1fr);gap:16px 32px;padding:0 0 40px clamp(24px,3vw,48px)\">\n            <span style=\"position:absolute;left:-5px;top:8px;width:9px;height:9px;background:#ffffff;border:1px solid #23272b\"><\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:0.06em;color:#4b5157;padding-top:4px\">{{ e.time }}<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(22px,1.9vw,32px);line-height:1.2;letter-spacing:-0.015em\">{{ e.title }}<\u002Fspan>\n              <span style=\"font-size:clamp(15px,1vw,18px);line-height:1.6;color:#4b5157;max-width:34em\">{{ e.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <p style=\"margin:0;padding:24px 0 0;border-top:1px solid #dcdfe2;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.06em;color:#4b5157\">TIMINGS TO BE CONFIRMED. THIS PAGE WILL BE UPDATED AS THE SCHEDULE IS FINALISED.<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Results\">\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding-top:40px\">\n    <div style=\"display:flex;align-items:center;gap:24px\">\n      <span style=\"width:48px;height:4px;background:#3aaee8\"><\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">COGNIX ’26 / RESULTS<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">{{ resultsStatus }}<\u002Fspan>\n  <\u002Fdiv>\n  <h1 style=\"margin:clamp(48px,5.5vw,96px) 0 0;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(52px,8.6vw,150px);line-height:0.92;letter-spacing:-0.045em;text-transform:uppercase\">Results<\u002Fh1>\n  <div style=\"height:1px;background:#dcdfe2;margin-top:clamp(48px,5.5vw,96px)\"><\u002Fdiv>\n\n  <p style=\"margin:0;padding:clamp(40px,3.6vw,64px) 0;font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,2.9vw,50px);line-height:1.12;letter-spacing:-0.02em;max-width:18em;text-wrap:pretty\">Winning teams are announced at the close of the Saturday hackathon.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));border-top:1px solid #23272b\">\n    <sc-for list=\"{{ podium }}\" as=\"p\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;flex-direction:column;gap:20px;padding:36px clamp(20px,2.5vw,44px) 48px 0;border-bottom:1px solid #dcdfe2\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">{{ p.place }}<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(88px,9vw,160px);line-height:0.85;letter-spacing:-0.05em\">{{ p.num }}<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid #dcdfe2\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;color:#4b5157;padding-top:12px\">TEAM<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(24px,2vw,34px);line-height:1.15;letter-spacing:-0.02em\">{{ p.team }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;color:#4b5157;padding-top:12px\">PROJECT<\u002Fspan>\n          <span style=\"font-size:clamp(16px,1.1vw,19px);line-height:1.5;color:#23272b\">{{ p.project }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showShowcase }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding-top:clamp(64px,6vw,112px)\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 40px;padding-bottom:24px;border-bottom:1px solid #23272b\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,1vw,17px);letter-spacing:0.08em;color:#4b5157\">PROJECT SHOWCASE<\u002Fspan>\n          <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(30px,3.4vw,58px);line-height:1.02;letter-spacing:-0.03em\">What the teams built<\u002Fh2>\n        <\u002Fdiv>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.06em;color:#4b5157\">PUBLISHED AFTER JUDGING<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:48px clamp(24px,3vw,48px);padding-top:40px\">\n        <sc-for list=\"{{ showcase }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div style=\"aspect-ratio:16/10;border:1px solid #dcdfe2;background:#f3f6f9;display:flex;align-items:center;justify-content:center\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;color:#4b5157\">PROJECT SCREENSHOT<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;color:#4b5157\">{{ s.label }}<\u002Fspan>\n            <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(22px,1.8vw,30px);line-height:1.2;letter-spacing:-0.015em\">{{ s.title }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:1.6;color:#4b5157\">{{ s.team }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fmain>\n\n<footer style=\"margin-top:clamp(80px,8vw,140px);background:#f3f6f9;padding:40px clamp(20px,7vw,120px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 40px\">\n  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;color:#4b5157\">COGNIX ’26 — WORKING EVENT NAME<\u002Fspan>\n  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;color:#4b5157\">HOSTED BY ACM KLH BACHUPALLY<\u002Fspan>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;problems&quot;,&quot;schedule&quot;,&quot;results&quot;],&quot;default&quot;:&quot;problems&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;released&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showcase&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: this.hashPage() || this.props.page || 'problems', track: 'all' };\n  hashPage() {\n    const h = (typeof location !== 'undefined' ? location.hash : '').replace('#', '');\n    return ['problems', 'schedule', 'results'].includes(h) ? h : null;\n  }\n  componentDidMount() {\n    this.onHash = () => { const p = this.hashPage(); if (p) this.setState({ page: p }); window.scrollTo(0, 0); };\n    window.addEventListener('hashchange', this.onHash);\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); }\n  componentDidUpdate(prev) {\n    if (prev.page !== this.props.page && this.props.page) this.setState({ page: this.props.page });\n  }\n  renderVals() {\n    const { page, track } = this.state;\n    const released = this.props.released ?? false;\n    const tba = 'To be announced';\n    const pendingBody = 'The full problem description, constraints and evaluation notes will be published here when statements are released on Friday.';\n    const tracks = [\n      { num: '01', name: 'Track name to be announced', statements: [\n        { id: 'PS-01', title: 'Statement title to be announced', body: pendingBody },\n        { id: 'PS-02', title: 'Statement title to be announced', body: pendingBody }] },\n      { num: '02', name: 'Track name to be announced', statements: [\n        { id: 'PS-03', title: 'Statement title to be announced', body: pendingBody },\n        { id: 'PS-04', title: 'Statement title to be announced', body: pendingBody }] }\n    ].map(t => ({ ...t, countLabel: String(t.statements.length).padStart(2, '0') + (t.statements.length === 1 ? ' STATEMENT' : ' STATEMENTS') }));\n    const chips = [{ key: 'all', label: 'ALL TRACKS' }, ...tracks.map(t => ({ key: t.num, label: 'TRACK ' + t.num }))]\n      .map(c => ({ ...c, active: track === c.key, inactive: track !== c.key, pick: () => this.setState({ track: c.key }) }));\n    const days = [\n      { num: '01', name: 'Friday', dateLabel: 'DATE TBA', summary: 'Problem statements released.', items: [\n        { time: 'TBA', title: 'Problem statement release', note: 'All tracks and statements published on the Problem statements page.' }] },\n      { num: '02', name: 'Saturday', dateLabel: 'DATE TBA', summary: 'The hackathon.', items: [\n        { time: 'TBA', title: 'Hacking begins', note: 'Further details to be announced.' },\n        { time: 'TBA', title: 'Submissions close', note: 'Further details to be announced.' },\n        { time: 'TBA', title: 'Results announced', note: 'Winners published on the Results page.' }] }\n    ];\n    const podium = [['FIRST PLACE', '01'], ['SECOND PLACE', '02'], ['THIRD PLACE', '03']]\n      .map(([place, num]) => ({ place, num, team: tba, project: 'Project title to be announced' }));\n    const showcase = ['01', '02', '03'].map(n => ({ label: 'PROJECT ' + n, title: 'Project title to be announced', team: 'Team name to be announced' }));\n    const nav = [\n      { label: 'The brief', href: '#brief', key: 'brief' },\n      { label: 'Problem statements', href: '#problems', key: 'problems' },\n      { label: 'Schedule', href: '#schedule', key: 'schedule' },\n      { label: 'Results', href: '#results', key: 'results' },\n      { label: 'FAQ', href: '#faq', key: 'faq' }\n    ].map(n => ({ ...n, active: n.key === page }));\n    return {\n      nav, chips, days, podium, showcase,\n      isProblems: page === 'problems', isSchedule: page === 'schedule', isResults: page === 'results',\n      pending: !released,\n      trackSummary: released ? tracks.length + ' tracks' : 'To be announced',\n      visibleTracks: track === 'all' ? tracks : tracks.filter(t => t.num === track),\n      resultsStatus: 'TO BE ANNOUNCED',\n      showShowcase: this.props.showcase ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{position:fixed;right:16px;bottom:16px;z-index:2147483646;display:flex;align-items:center;gap:7px;height:30px;padding:0 5px 0 10px;border-radius:999px;font-family:\"Anthropic Sans\",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12.5px;font-weight:400;line-height:1;letter-spacing:normal;text-transform:none;color:#141413;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(31,30,29,.14),0 2px 10px rgba(0,0,0,.09)}\n#__claude_design_branding *{box-sizing:border-box;margin:0}\n#__claude_design_branding a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}\n#__claude_design_branding a:hover span{text-decoration:underline}\n#__claude_design_branding svg{flex:none}\n#__claude_design_branding a svg{color:#D97757}\n#__
