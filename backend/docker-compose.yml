services:
  mysql:
    image: mysql:8.4
    container_name: cognix26-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "0206"
      MYSQL_DATABASE: cognix_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p0206"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
